name: Daily Tournament Scrape

# Cron pakai UTC. 22:00 UTC = 05:00 WIB (next day).
# GitHub Actions cron kadang delay 5-15 menit di peak load — wajar.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: # tombol manual di tab Actions

permissions:
  contents: write # supaya workflow bisa commit balik ke repo

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run scraper (with details)
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python scrape_tournaments.py --with-details --quiet
        # kalau scraper fail (misal chess-results.com down), workflow fail visible.
        # tournaments.json lama tetap aman karena belum commit.

      - name: Rebuild index.html
        run: python build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tournaments.json index.html leads/ 2>/dev/null || git add tournaments.json index.html
          if git diff --staged --quiet; then
            echo "✓ No changes — tournaments.json identical to last run."
          else
            git commit -m "chore: daily scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✓ Pushed updated data."
          fi
